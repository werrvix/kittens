<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop</title>
<style>body{font-family:sans-serif;max-width:640px;margin:40px auto;padding:0 16px}
input{padding:10px;width:60%}button{padding:10px 18px}
table{border-collapse:collapse;margin-top:16px;width:100%}
td,th{border:1px solid #ccc;padding:8px;text-align:left}a{color:#2563eb}code{background:#eee;padding:1px 4px}</style>
</head><body>
<p><a href="../index.html">&larr; home</a></p>
<h2>Cat shop — product search</h2>
<input id="q" placeholder="Product name..." onkeydown="if(event.key==='Enter')go()"><button onclick="go()">Search</button>
<div id="out"></div>
<p style="color:#888;margin-top:30px">Hint: this search returns <b>2 columns</b> (name, price).
Use <code>UNION SELECT</code> to read other tables.
First find what tables exist, then pull the data.</p>
<script src="../lib/sql-wasm.js"></script>
<script>
var db=null;
initSqlJs({locateFile:function(f){return "../lib/"+f;}}).then(function(SQL){
  db=new SQL.Database();
  db.run("CREATE TABLE products(name TEXT,price TEXT)");
  db.run("INSERT INTO products VALUES('Cat food','45 UAH')");
  db.run("INSERT INTO products VALUES('Scratching post','650 UAH')");
  db.run("INSERT INTO products VALUES('Toy mouse','35 UAH')");
  db.run("INSERT INTO products VALUES('Catnip','90 UAH')");
  db.run("INSERT INTO products VALUES('Litter box','420 UAH')");
  db.run("CREATE TABLE secret(note TEXT, flag TEXT)");
  db.run("INSERT INTO secret VALUES('admin note',?)",[atob("a3Bpe3Bhd3Nfb25fdGhlX3NlY3JldF90YWJsZX0=")]);db.run("INSERT INTO secret VALUES('user note','not the flag')");db.run("INSERT INTO secret VALUES('backup','also not it')");
});
function go(){
  if(!db)return;
  var q=document.getElementById("q").value;
  var sql="SELECT name,price FROM products WHERE name = '"+q+"'";
  var out=document.getElementById("out");
  try{var r=db.exec(sql); var rows=r.length?r[0].values:[];
    var h="<table><tr><th>Name</th><th>Price</th></tr>";
    for(var i=0;i<rows.length;i++) h+="<tr><td>"+rows[i][0]+"</td><td>"+rows[i][1]+"</td></tr>";
    h+="</table>"; out.innerHTML=rows.length?h:"<p>Nothing found</p>";
  }catch(e){out.innerHTML="<p style='color:red'>SQL error: "+e+"</p><code>"+sql+"</code>";}
}
</script></body></html>
